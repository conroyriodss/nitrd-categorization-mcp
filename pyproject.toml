[project]
name = "nitrd-categorization-mcp"
version = "0.1.0"
description = "Three MCP servers for NITRD categorization of NIH grants: nih-grants-outputs (read), nitrd-classifier (inference), reviewer-portal (sandbox write)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Built against the FastMCP 4.x API (e.g. list_tools(), not get_tools()).
    "fastmcp>=4.0,<5",
    "databricks-sdk>=0.40",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
# Only the nitrd-classifier server needs the ML stack. Install locally with
# `uv sync --extra classifier`. Databricks Apps do not read pyproject.toml; each
# App installs deploy/databricks/<server>/requirements.txt (keep them in sync).
classifier = [
    "scikit-learn>=1.6",
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "joblib>=1.4",
]

[project.scripts]
# One console script per server, e.g. `uv run nih-grants-outputs`.
nih-grants-outputs = "nih_grants_outputs.app:main"
nitrd-classifier = "nitrd_classifier.app:main"
reviewer-portal = "reviewer_portal.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/shared",
    "src/nih_grants_outputs",
    "src/nitrd_classifier",
    "src/reviewer_portal",
]

[dependency-groups]
# Dev + eval-only deps. Install with `uv sync --group dev`.
# The Phoenix evaluation harness (see eval/) is not scaffolded in this template
# on purpose — add these when you build it per the mcp-eval skill.
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", ".agents"]
# Don't reformat Python code fences inside Markdown docs (they're illustrative
# snippets, not runnable modules).
extend-exclude = [
    "*.md",
    "src/nih_grants_outputs/resources/nitrd_intensity/nitrd_intensity.py",
    "src/nitrd_classifier/subcategory/engine.py",
    "docs/analysis/feature_ablation.py",
]
# ^ vendored code: nitrd_intensity v0.1.0 is byte-identical (SHA-checked); the
#   uac-nitrd engine keeps upstream scoring functions textually unchanged.
#   feature_ablation.py is kept as run: docs/analysis/feature_ablation.md cites
#   its sha256, so it is not reformatted.

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
