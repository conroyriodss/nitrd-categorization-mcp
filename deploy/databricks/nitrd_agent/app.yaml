# Databricks App: mcp-nitrd-agent (thin agent over the three MCP apps).
# https://docs.databricks.com/aws/en/dev-tools/databricks-apps/app-runtime
#
# Source root = repo root at a commit, sparse: src/nitrd_agent and this folder
# (copy this file + requirements.txt to the root when staging). Resources:
#   mcp-outputs / mcp-classifier / mcp-portal   app, CAN_USE (the three MCP apps)
#   llm-endpoint     serving endpoint databricks-gpt-6-1-sol, CAN_QUERY
#   sql-warehouse    CAN_USE (harness only: row counts, AES-10 cleanup, results)
# Table grants to this App's SP (harness only; the model has no SQL tool):
#   SELECT + MODIFY on review_requests, review_events, routing_events (cleanup
#   by request_id, as in the e2e/lifecycle suites); SELECT + MODIFY on
#   agent_eval_runs (results).
command:
  [
    "/bin/sh",
    "-c",
    "export PYTHONPATH=/app/python/source_code/src:$PYTHONPATH && python -m nitrd_agent.app",
  ]

env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: NITRD_AGENT_MODEL
    value: databricks-gpt-6-1-sol
  - name: NITRD_AGENT_URL_OUTPUTS
    value: https://mcp-nih-grants-outputs-7474654188777746.aws.databricksapps.com/mcp
  - name: NITRD_AGENT_URL_CLASSIFIER
    value: https://mcp-nitrd-classifier-7474654188777746.aws.databricksapps.com/mcp
  - name: NITRD_AGENT_URL_PORTAL
    value: https://mcp-nitrd-reviewer-portal-7474654188777746.aws.databricksapps.com/mcp
  # "1" runs the AES functional suite at startup unless this commit's result is
  # already recorded in agent_eval_runs. It is "0" because the suite is started
  # only as a supervised one-shot (void run c1ab24d7, eval/agent/README.md).
  - name: NITRD_AGENT_AES_ON_START
    value: "0"
