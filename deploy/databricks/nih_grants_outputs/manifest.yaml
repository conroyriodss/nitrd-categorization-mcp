# cloud.gov (Cloud Foundry) manifest for nih-grants-outputs. Not used by the
# Databricks deployment (the hackathon target); kept per server for parity with
# the template. Push from the repo root:
#   cf push -f deploy/databricks/nih_grants_outputs/manifest.yaml
applications:
  - name: nih-grants-outputs
    buildpacks:
      - python_buildpack
    command: PYTHONPATH=src python -m nih_grants_outputs.app
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      PYTHONUNBUFFERED: 1
    routes:
      - route: nih-grants-outputs.app.cloud.gov
    disk_quota: 1G
    memory: 256M
