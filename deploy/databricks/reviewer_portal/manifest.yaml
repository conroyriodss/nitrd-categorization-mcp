# cloud.gov (Cloud Foundry) manifest for reviewer-portal. Not used by the
# Databricks deployment (the hackathon target); kept per server for parity with
# the template. Push from the repo root:
#   cf push -f deploy/databricks/reviewer_portal/manifest.yaml
applications:
  - name: reviewer-portal
    buildpacks:
      - python_buildpack
    command: PYTHONPATH=src python -m reviewer_portal.app
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      PYTHONUNBUFFERED: 1
    routes:
      - route: reviewer-portal.app.cloud.gov
    disk_quota: 1G
    memory: 256M
