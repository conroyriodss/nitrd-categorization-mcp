# Databricks App: reviewer-portal (sandbox writes: review requests, decisions, routing).
# https://docs.databricks.com/aws/en/dev-tools/databricks-apps/app-runtime
#
# Deploy (stages this file + requirements.txt + src/shared + src/reviewer_portal):
#   set -a; source deploy/databricks/.env; source deploy/databricks/reviewer_portal/.env; set +a
#   bash deploy/databricks/deploy-databricks-app.sh
#
# Endpoints:  https://<app-url>/mcp (streamable HTTP)   /health   /version
#
# Databricks injects DATABRICKS_APP_PORT, DATABRICKS_HOST, DATABRICKS_CLIENT_ID and
# DATABRICKS_CLIENT_SECRET (this App's own service principal). This is the only
# App whose service principal gets write grants (review_requests, review_events,
# routing_events). Every record it writes carries sandbox=true.
command:
  [
    "/bin/sh",
    "-c",
    "export PYTHONPATH=/app/python/source_code/src:$PYTHONPATH && python -m reviewer_portal.app",
  ]

# Requires a SQL warehouse resource with key "sql-warehouse" attached to this App
# (CAN_USE). The warehouse ID is set on the resource, not here.
env:
  - name: PORTAL_DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # Operator pages call outputs_find_cohort and the classifier tools server-side
  # with this App's own SP token (CAN_USE on both apps). Unset, they default to
  # localhost and every operator page fails (scripts/migrations/STEP_G_RUNBOOK.md).
  - name: PORTAL_OUTPUTS_URL
    value: https://mcp-nih-grants-outputs-7474654188777746.aws.databricksapps.com/mcp
  - name: PORTAL_CLASSIFIER_URL
    value: https://mcp-nitrd-classifier-7474654188777746.aws.databricksapps.com/mcp
  # Fix (c): the people who may decide (reviewer_portal.approvers), comma-separated,
  # matched against x-forwarded-email after strip().lower(). Unset or empty refuses
  # every decision (fails closed). A service principal's x-forwarded-email is its
  # application id, so no SP can be listed by accident. The agent app has its own
  # separately configured list (deploy/databricks/nitrd_agent/app.yaml).
  - name: NITRD_APPROVERS
    value: conroyri@nih.gov
